          outputs:
            full.design.handoff:
              handoffContext: docs/openspec/changes/sync-upstream-2-5-1-14/.comet/handoff/design-context.json
              handoffHash: 92aab94bd1114e5d6ff10a9faa3cd548e029e3f653ac8713e2cbddd139217fcf
              proposal: |-
                ## 候选方案

                ### 1. 合并方式
                - 采用：git merge upstream/main（保留上游为祖先，后续同步可持续复用同一 merge-base；fork 的 20 个提交不改写历史）。
                - 备选：cherry-pick c001f54/9e528bf/92a3b74/84645de（丢失祖先关系，下次需重算差异）；rebase fork 提交（改写已推送历史，风险高）。

                ### 2. 构建链（双方重复实现的 Alderis iOS 26 tab 补丁）
                - 采用上游 patches/alderis-ios26-tab.patch + Makefile patch-deps（stage: patch-deps all；xcodebuild 加 -disableAutomaticPackageResolution）。
                - 删除 fork 的 Scripts/patch-alderis-checkout.sh 及 Makefile 内联解析/补丁调用。
                - 保留 fork 的 RUN_CLANG_STATIC_ANALYZER=NO 与 SILEO_APP_INSTALL_PATH/postinst 路径替换（解决不同问题）。

                ### 3. .tbd 架构声明
                - 采用上游 [arm64, arm64e]：双方都移除了模拟器架构，上游额外保留 arm64e，属于规范版本，减少后续冲突。

                ### 4. 源格式校验（上游新增 hasCompatibleSourceFormat）
                - 移植上游的 URL/scheme/host 校验到 importRepos(fromURL:)、presentAddClipBoardPrompt、handleSourceAdd 三处。
                - 去掉上游「suite 必须为 ./ 且 components 必须为空」的限制，保留 fork 的 suite/components 源管理能力（已确认：适配保留两者）。

                ### 5. Jailbreak/Bootstrap 重构
                - 整体采用上游简化枚举与新增 Relaxin 分支，同步更新 fork 引用点；本 fork 无 Codable 持久化，rawValue 仅用于展示，重命名安全。

                ### 6. 冲突解决原则
                - fork 独有功能文件以 fork 行为为准，合入上游无关修复。
                - 上游共享基础设施（Jailbreak/Bootstrap、DownloadManager、DatabaseManager、APTWrapper、ControlFileParserFast、Depiction*、SileoNavigationController、Info.plist）以上游为准。
                - 双方防护性改动（NewsViewController、PackageListViewController 安全索引/并发）取并集，复用 fork 已抽出的辅助方法。
                - PackageListManager 保留 fork 屏蔽更新过滤 + 采用上游排序比较器修正；DownloadManager 保留 fork Patcher 优先 + 采用上游损坏包/IncompatibleRepo 重构。
                - project.pbxproj 采用 MARKETING_VERSION=2.5.1-14，保留 fork 新增文件引用（UpdateBlockManager、BlockedUpdatesViewController、RootHideCompat、测试）。

                ### 7. 版本号
                - 采用上游 2.5.1-14；父工作区未提交的 2.5.1-13 提升不进入本 change 分支。

                ## 关键取舍与风险
                - 取舍：merge 一次性解决冲突优于长期维护两套等价构建链；采用上游规范版本以降低后续同步成本。
                - 风险：大面积文本冲突可能覆盖 fork 功能 → 逐文件解决 + 定向 diff 复核 + 构建/测试验证。
                - 风险：patch-deps 依赖 SPM checkout 为 git 仓库；make stage 验证失败时报告，不擅自回退 fork 脚本（回退属范围变化）。
                - 风险：Jailbreak 重命名导致编译错误 → 合并后构建并修正引用。
                - 风险：无法设备级验证 UI → 以 xcodebuild/make stage + UpdateBlockManagerTests 作为可执行验证，并在交付说明中明确限制。
                - 风险：上游 UIDesignRequiresCompatibility 改变 iOS 26 外观 → 属上游有意行为，保留。

                ## 测试策略
                - 合并后构建：make stage 或 xcodebuild 成功。
                - 运行 UpdateBlockManagerTests（无法运行时记录原因与替代验证）。
                - grep 校验 fork 功能符号（UpdateBlockManager、RepoManagementPolicy、RootHideCompat、patcherBundleIDs）仍存在。
                - git merge-base --is-ancestor upstream/main HEAD 验证祖先关系；git diff --check 与 plutil -lint 检查格式。

                ## Spec Patch
                - 无。Open 阶段已写入 specs/source-entry-validation/spec.md（URL 合法性校验 + suite/components 支持），设计阶段不新增或改写行为规格。
